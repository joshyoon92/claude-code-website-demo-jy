<div class="ic-body clip" id="canvas" data-start="0" data-duration="6.8" data-track-index="0"><div id="image" data-layout-allow-overflow="true" data-layout-overflow-reason="Image punch-in is intentionally cropped by the canvas"></div><svg id="type-art" viewBox="0 0 984 580"><defs><mask id="letters"><rect width="984" height="580" fill="black"/><text id="mask-word" x="492" y="372" text-anchor="middle" font-family="Geist, sans-serif" font-size="270" font-weight="600" letter-spacing="-20" fill="white"></text></mask></defs><rect id="cover" width="984" height="580" fill="#0a0a0a"/><g id="filled" data-layout-allow-overflow="true" data-layout-overflow-reason="Image texture extends behind the glyph mask" mask="url(#letters)"></g><text id="outline-word" x="492" y="372" text-anchor="middle" font-family="Geist, sans-serif" font-size="270" font-weight="600" letter-spacing="-20" fill="none" stroke="#0a0a0a" stroke-width="2"></text></svg><div id="poster-top" class="ic-label">FORM / STUDIES</div><div id="poster-line"></div><div id="poster-caption"></div></div>

<script>(()=>{
const V=CHA.vars({"headline": "이미지가 글자의 표면이 될 때", "word": "FORM", "caption": "이미지로 쓰는 새로운 문장", "image": ""});
