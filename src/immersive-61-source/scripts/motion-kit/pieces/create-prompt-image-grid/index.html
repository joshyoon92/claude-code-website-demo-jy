<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=830">
<link rel="stylesheet" href="brand/cha.css"><link rel="stylesheet" href="brand/immersive-create.css">
<script src="brand/gsap.min.js"></script><script src="brand/cha-motion.js"></script><script src="brand/immersive-create.js"></script>
<style>#prompt{left:88px;top:230px;width:808px}.tile{position:absolute;width:420px;height:200px;overflow:hidden;border-radius:12px}.tile i{position:absolute;inset:0;background:#202020}.tile-label{position:absolute;bottom:12px;left:16px;font-size:20px;color:#0a0a0a;background:#f4f3ee;padding:3px 7px}#picked{left:520px;top:135px;width:420px;height:200px;transform-origin:0 0}#selection{position:absolute;left:514px;top:129px;width:432px;height:212px;border:4px solid #d4f527;border-radius:16px}#note{position:absolute;left:26px;bottom:24px}</style><link rel="stylesheet" href="brand/immersive-life.css"><script src="brand/immersive-life.js"></script></head><body>
<div class="cha ic-stage" id="stage" data-composition-id="create-prompt-image-grid" data-start="0" data-duration="6.8" data-width="1080" data-height="830" data-composition-variables='[{&quot;id&quot;: &quot;headline&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;headline&quot;, &quot;default&quot;: &quot;한 문장이 네 장의 시안으로&quot;}, {&quot;id&quot;: &quot;prompt&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;prompt&quot;, &quot;default&quot;: &quot;종이 건축물이 있는 초현실 풍경&quot;}, {&quot;id&quot;: &quot;image&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;image&quot;, &quot;default&quot;: &quot;&quot;}]'>
<div class="ic-head"><span>CREATE / PROMPT-IMAGE-GRID</span><span>CHA MOTION</span></div><div class="ic-title" id="headline"></div>
<div class="ic-body clip" id="canvas" data-start="0" data-duration="6.8" data-track-index="0"><div class="ic-prompt" id="prompt"><span id="typed"></span></div><div id="tiles"></div><div id="picked" class="ic-panel"></div><div id="selection"></div><div id="pointer"></div><div class="ic-pill" id="note">02 / 04</div></div>
<div class="ic-foot"><span>설명용 재연 · 원본 벡터 아트</span><span>EDITABLE / 06.8 SEC</span></div></div>
<script>(()=>{
const V=CHA.vars({"headline": "한 문장이 네 장의 시안으로", "prompt": "종이 건축물이 있는 초현실 풍경", "image": ""});
IC.setText('headline',IC.txt(V.headline,22));
const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{};
window.__timelines["create-prompt-image-grid"]=tl;
document.getElementById('tiles').innerHTML=[0,1,2,3].map((n)=>`<div class="tile" style="left:${n%2?520:44}px;top:${n<2?135:355}px">${IC.art(n)}<i></i><span class="tile-label">0${n+1}</span></div>`).join('');
document.getElementById('picked').innerHTML=IC.art(1,V.image);document.getElementById('pointer').innerHTML=IC.cursor();
gsap.set(['.tile','#picked','#selection','#note'],{opacity:0});gsap.set('#ic-cursor',{x:820,y:560,opacity:0});
CHA.type(tl,'#typed',IC.txt(V.prompt,24),0.25,{cps:42,caret:false});
tl.to('#prompt',{y:-205,duration:.7,ease:'power3.inOut'},1.5);
tl.to('.tile',{opacity:1,stagger:.12,duration:.25},1.75);tl.to('.tile i',{scaleY:0,transformOrigin:'50% 100%',duration:.75,stagger:.13,ease:'power3.inOut'},2.05);
tl.to('#ic-cursor',{opacity:1,x:747,y:254,duration:.65,ease:'power3.inOut'},3.35);tl.to('#selection',{opacity:1,duration:.18},3.95);tl.to('#ic-cursor',{scale:.8,duration:.09,repeat:1,yoyo:true},4.05);
tl.set('#picked',{opacity:1},4.25);tl.to(['#tiles','#selection','#prompt','#ic-cursor'],{opacity:0,duration:.35},4.25);
tl.to('#picked',{x:-520,y:-135,scaleX:984/420,scaleY:580/200,borderRadius:0,duration:1.0,ease:'power3.inOut'},4.25);tl.to('#note',{opacity:1,duration:.3},5.45);
tl.set({},{},6.8);IMM.life(tl);tl.seek(0);
})();</script></body></html>
