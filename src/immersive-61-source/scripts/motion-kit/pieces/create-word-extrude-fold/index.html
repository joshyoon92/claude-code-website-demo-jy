<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=830">
<link rel="stylesheet" href="brand/cha.css"><link rel="stylesheet" href="brand/immersive-create.css">
<script src="brand/gsap.min.js"></script><script src="brand/cha-motion.js"></script><script src="brand/immersive-create.js"></script>
<style>#type-rig{position:absolute;left:40px;top:137px;width:904px;height:242px;transform-style:preserve-3d}.depth-word{position:absolute;inset:0;font-size:208px;font-weight:600;line-height:1;letter-spacing:-.065em;text-align:center;white-space:nowrap;color:#f4f3ee;backface-visibility:visible}.depth-word:last-child{color:#f4f3ee;-webkit-text-stroke:0}#fold-line{position:absolute;left:160px;top:418px;width:664px;height:4px;background:#d4f527;transform-origin:0 50%}#fold-copy{position:absolute;left:80px;right:80px;top:457px;text-align:center;font-size:35px;color:#ccc}</style><link rel="stylesheet" href="brand/immersive-life.css"><script src="brand/immersive-life.js"></script></head><body>
<div class="cha ic-stage" id="stage" data-composition-id="create-word-extrude-fold" data-start="0" data-duration="6.8" data-width="1080" data-height="830" data-composition-variables='[{&quot;id&quot;: &quot;headline&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;headline&quot;, &quot;default&quot;: &quot;글자의 깊이를 접어 한 줄로&quot;}, {&quot;id&quot;: &quot;word&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;word&quot;, &quot;default&quot;: &quot;DEPTH&quot;}, {&quot;id&quot;: &quot;caption&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;caption&quot;, &quot;default&quot;: &quot;생각에 깊이를 더하다&quot;}]'>
<div class="ic-head"><span>CREATE / WORD-EXTRUDE-FOLD</span><span>CHA MOTION</span></div><div class="ic-title" id="headline"></div>
<div class="ic-body clip" id="canvas" data-start="0" data-duration="6.8" data-track-index="0"><div id="type-rig"></div><div id="fold-line"></div><div id="fold-copy"></div></div>
<div class="ic-foot"><span>설명용 재연 · 원본 벡터 아트</span><span>EDITABLE / 06.8 SEC</span></div></div>
<script>(()=>{
const V=CHA.vars({"headline": "글자의 깊이를 접어 한 줄로", "word": "DEPTH", "caption": "생각에 깊이를 더하다"});
IC.setText('headline',IC.txt(V.headline,22));
const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{};
window.__timelines["create-word-extrude-fold"]=tl;
const word=IC.txt(V.word,6).toUpperCase();document.getElementById('type-rig').innerHTML=Array.from({length:9},(_,i)=>`<svg class="depth-word" data-layout-allow-overflow="true" data-layout-overflow-reason="Depth planes project beyond their local 3D rig during the orbit" id="depth${i}" viewBox="0 0 904 242" role="img" aria-label="${IC.esc(word)}의 깊이 레이어"><text data-layout-allow-overlap="true" data-layout-overlap-reason="Nine copies of the same word form one intentional extrusion" x="452" y="205" text-anchor="middle" font-family="Geist, sans-serif" font-size="208" font-weight="600" letter-spacing="-12" fill="${i===8?'#f4f3ee':'none'}" stroke="${i===8?'none':'#64645e'}" stroke-width="1.2">${IC.esc(word)}</text></svg>`).join('');IC.setText('fold-copy',V.caption);gsap.set('#fold-line',{scaleX:0});gsap.set('#fold-copy',{opacity:0,rotationX:-90,transformOrigin:'50% 0%'});
tl.to('#type-rig',{rotationY:-28,rotationX:14,scale:.78,duration:1.1,ease:'power3.inOut'},.45);for(let i=0;i<9;i++)tl.to('#depth'+i,{z:(i-4)*23,y:(i-4)*3,duration:1.05,ease:'power3.inOut'},.65+i*.04);tl.to('#type-rig',{rotationY:17,rotationX:-6,duration:1.6,ease:'power2.inOut'},2.05);for(let i=0;i<9;i++)tl.to('#depth'+i,{z:0,y:0,duration:.85,ease:'power3.inOut'},3.8);tl.to('#type-rig',{rotationY:0,rotationX:0,scale:1,duration:.85,ease:'power3.inOut'},3.8);tl.to('#fold-line',{scaleX:1,duration:.6,ease:'power3.out'},4.55);tl.to('#fold-copy',{opacity:1,rotationX:0,duration:.8,ease:'power3.out'},4.85);
tl.set({},{},6.8);IMM.life(tl);tl.seek(0);
})();</script></body></html>
