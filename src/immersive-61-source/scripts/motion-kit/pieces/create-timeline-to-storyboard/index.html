<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=830">
<link rel="stylesheet" href="brand/cha.css"><link rel="stylesheet" href="brand/immersive-create.css">
<script src="brand/gsap.min.js"></script><script src="brand/cha-motion.js"></script><script src="brand/immersive-create.js"></script>
<style>#track{position:absolute;left:42px;right:42px;top:382px;height:136px;border-top:1px solid #555;border-bottom:1px solid #555}#track span{position:absolute;top:42px;left:10px;font-size:20px;color:#888}#track-line{position:absolute;left:140px;top:0;width:2px;height:136px;background:#777}.panel{position:absolute;top:398px;height:104px;width:225px;border-radius:8px;overflow:hidden;transform-origin:0 0}.caption{position:absolute;top:402px;width:276px;color:#ccc;font-size:26px;line-height:1.3}.caption small{display:block;font-size:19px;color:#888;margin-bottom:12px}#playhead{position:absolute;left:192px;top:368px;height:162px;width:3px;background:#d4f527}#board-title{position:absolute;left:44px;top:48px;font-size:25px}</style><link rel="stylesheet" href="brand/immersive-life.css"><script src="brand/immersive-life.js"></script></head><body>
<div class="cha ic-stage" id="stage" data-composition-id="create-timeline-to-storyboard" data-start="0" data-duration="6.8" data-width="1080" data-height="830" data-composition-variables='[{&quot;id&quot;: &quot;headline&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;headline&quot;, &quot;default&quot;: &quot;타임라인을 장면 계획으로&quot;}, {&quot;id&quot;: &quot;step1&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;step1&quot;, &quot;default&quot;: &quot;입력 · 아이디어를 적는다&quot;}, {&quot;id&quot;: &quot;step2&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;step2&quot;, &quot;default&quot;: &quot;변환 · 결과를 살펴본다&quot;}, {&quot;id&quot;: &quot;step3&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;step3&quot;, &quot;default&quot;: &quot;선택 · 하나로 완성한다&quot;}]'>
<div class="ic-head"><span>CREATE / TIMELINE-TO-STORYBOARD</span><span>CHA MOTION</span></div><div class="ic-title" id="headline"></div>
<div class="ic-body clip" id="canvas" data-start="0" data-duration="6.8" data-track-index="0"><div id="track"><span>VIDEO 01</span><div id="track-line"></div></div><div id="panels"></div><div id="playhead"></div><div id="captions"></div><div id="board-title" class="ic-label">STORYBOARD / 3 SHOTS</div></div>
<div class="ic-foot"><span>설명용 재연 · 원본 벡터 아트</span><span>EDITABLE / 06.8 SEC</span></div></div>
<script>(()=>{
const V=CHA.vars({"headline": "타임라인을 장면 계획으로", "step1": "입력 · 아이디어를 적는다", "step2": "변환 · 결과를 살펴본다", "step3": "선택 · 하나로 완성한다"});
IC.setText('headline',IC.txt(V.headline,22));
const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{};
window.__timelines["create-timeline-to-storyboard"]=tl;
const labels=[V.step1,V.step2,V.step3];document.getElementById('panels').innerHTML=labels.map((_,i)=>`<div class="panel" id="p${i}" style="left:${195+i*242}px">${IC.art(i)}</div>`).join('');document.getElementById('captions').innerHTML=labels.map((s,i)=>`<div class="caption" style="left:${42+i*306}px"><small>SHOT 0${i+1}</small>${IC.esc(IC.txt(s,22))}</div>`).join('');gsap.set(['.caption','#board-title'],{opacity:0});
tl.to('#playhead',{x:716,duration:1.4,ease:'none'},.3);tl.to(['#track','#playhead'],{opacity:0,duration:.4},1.75);
for(let i=0;i<3;i++)tl.to('#p'+i,{x:42+i*306-(195+i*242),y:-273,scaleX:276/225,scaleY:245/104,duration:1.05,ease:'power3.inOut'},2+i*.12);
tl.to('.caption',{opacity:1,y:-10,stagger:.18,duration:.45},3.35);tl.to('#board-title',{opacity:1,duration:.4},3.8);
tl.set({},{},6.8);IMM.life(tl);tl.seek(0);
})();</script></body></html>
