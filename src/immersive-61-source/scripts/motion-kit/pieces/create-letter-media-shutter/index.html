<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=830">
<link rel="stylesheet" href="brand/cha.css"><link rel="stylesheet" href="brand/immersive-create.css">
<script src="brand/gsap.min.js"></script><script src="brand/cha-motion.js"></script><script src="brand/immersive-create.js"></script>
<style>#shutter-image{position:absolute;inset:0}#shutters{position:absolute;inset:0;display:flex;perspective:1100px}.shutter{width:246px;height:580px;flex:none;background:#f4f3ee;color:#0a0a0a;font-size:240px;line-height:580px;font-weight:500;text-align:center;border-right:1px solid #aaa;transform-origin:0 50%;backface-visibility:hidden}#shutter-caption{position:absolute;left:36px;bottom:28px;background:#d4f527;font-size:29px}</style><link rel="stylesheet" href="brand/immersive-life.css"><script src="brand/immersive-life.js"></script></head><body>
<div class="cha ic-stage" id="stage" data-composition-id="create-letter-media-shutter" data-start="0" data-duration="6.8" data-width="1080" data-height="830" data-composition-variables='[{&quot;id&quot;: &quot;headline&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;headline&quot;, &quot;default&quot;: &quot;글자가 열리면 장면이 시작된다&quot;}, {&quot;id&quot;: &quot;word&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;word&quot;, &quot;default&quot;: &quot;MAKE&quot;}, {&quot;id&quot;: &quot;caption&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;caption&quot;, &quot;default&quot;: &quot;상상하던 장면으로&quot;}, {&quot;id&quot;: &quot;image&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;image&quot;, &quot;default&quot;: &quot;&quot;}]'>
<div class="ic-head"><span>CREATE / LETTER-MEDIA-SHUTTER</span><span>CHA MOTION</span></div><div class="ic-title" id="headline"></div>
<div class="ic-body clip" id="canvas" data-start="0" data-duration="6.8" data-track-index="0"><div id="shutter-image"></div><div id="shutters"></div><div id="shutter-caption" class="ic-pill"></div></div>
<div class="ic-foot"><span>설명용 재연 · 원본 벡터 아트</span><span>EDITABLE / 06.8 SEC</span></div></div>
<script>(()=>{
const V=CHA.vars({"headline": "글자가 열리면 장면이 시작된다", "word": "MAKE", "caption": "상상하던 장면으로", "image": ""});
IC.setText('headline',IC.txt(V.headline,22));
const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{};
window.__timelines["create-letter-media-shutter"]=tl;
const word=IC.txt(V.word,4).toUpperCase().padEnd(4,' ');document.getElementById('shutters').innerHTML=Array.from(word).map(c=>`<div class="shutter">${IC.esc(c)}</div>`).join('');document.getElementById('shutter-image').innerHTML=IC.art(4,V.image);IC.setText('shutter-caption',V.caption);gsap.set('#shutter-caption',{opacity:0,y:15});gsap.set('#shutter-image',{scale:1.18});
tl.to('.shutter',{rotationY:-102,duration:1.2,stagger:.22,ease:'power3.inOut'},1);tl.to('.shutter',{opacity:0,duration:.3,stagger:.22},1.9);tl.to('#shutter-image',{scale:1,duration:2.2,ease:'power3.out'},2.1);tl.to('#shutter-caption',{opacity:1,y:0,duration:.6,ease:'power3.out'},4.4);
tl.set({},{},6.8);IMM.life(tl);tl.seek(0);
})();</script></body></html>
