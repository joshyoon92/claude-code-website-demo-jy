<script src="brand/gsap.min.js"></script><script src="brand/cha-motion.js"></script><script src="brand/immersive-create.js"></script>
<style>#source{position:absolute;left:115px;top:130px;width:754px;font-size:42px;line-height:1.7;letter-spacing:-.04em;color:#aaa}#source .extract{color:#f4f3ee;box-decoration-break:clone}#headline-result{position:absolute;left:114px;top:94px;font-size:88px;line-height:1.22;font-weight:500;letter-spacing:-.055em}#headline-result div{white-space:nowrap}#result-two{background:#d4f527;color:#0a0a0a;display:table;padding:0 12px;margin-left:-12px}#edit-note{position:absolute;left:115px;bottom:50px;font-size:23px;color:#888}</style><link rel="stylesheet" href="brand/immersive-life.css"><script src="brand/immersive-life.js"></script></head><body>
<div class="cha ic-stage" id="stage" data-composition-id="create-paragraph-to-headline" data-start="0" data-duration="6.8" data-width="1080" data-height="830" data-composition-variables='[{&quot;id&quot;: &quot;headline&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;headline&quot;, &quot;default&quot;: &quot;긴 설명에서 핵심만 꺼내기&quot;}, {&quot;id&quot;: &quot;lead&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;lead&quot;, &quot;default&quot;: &quot;모든 과정을 더 복잡하게 말하기보다,&quot;}, {&quot;id&quot;: &quot;first&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;first&quot;, &quot;default&quot;: &quot;핵심을&quot;}, {&quot;id&quot;: &quot;bridge&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;bridge&quot;, &quot;default&quot;: &quot;먼저 발견하고&quot;}, {&quot;id&quot;: &quot;second&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;second&quot;, &quot;default&quot;: &quot;선명하게&quot;}, {&quot;id&quot;: &quot;tail&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;tail&quot;, &quot;default&quot;: &quot;정리해서&quot;}, {&quot;id&quot;: &quot;third&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;third&quot;, &quot;default&quot;: &quot;전하세요&quot;}]'>
<div class="ic-head"><span>CREATE / PARAGRAPH-TO-HEADLINE</span><span>CHA MOTION</span></div><div class="ic-title" id="headline"></div>
<div class="ic-body clip" id="canvas" data-start="0" data-duration="6.8" data-track-index="0"><div id="source"><span id="lead"></span> <span class="extract" id="first"></span> <span id="bridge"></span> <span class="extract" id="second"></span> <span id="tail"></span> <span class="extract" id="third"></span></div><div id="headline-result"><div id="result-one"></div><div id="result-two" data-layout-allow-overflow="true" data-layout-overflow-reason="12px highlighter bleed around the selected word"></div><div id="result-three"></div></div><div id="edit-note" class="ic-label">KEEP THE CORE</div></div>
<div class="ic-foot"><span>설명용 재연 · 원본 벡터 아트</span><span>EDITABLE / 06.8 SEC</span></div></div>
<script>(()=>{
const V=CHA.vars({"headline": "긴 설명에서 핵심만 꺼내기", "lead": "모든 과정을 더 복잡하게 말하기보다,", "first": "핵심을", "bridge": "먼저 발견하고", "second": "선명하게", "tail": "정리해서", "third": "전하세요"});
IC.setText('headline',IC.txt(V.headline,22));
const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{};
window.__timelines["create-paragraph-to-headline"]=tl;
['lead','first','bridge','second','tail','third'].forEach(k=>IC.setText(k,V[k]));IC.setText('result-one',V.first);IC.setText('result-two',V.second);IC.setText('result-three',V.third);gsap.set('#headline-result>div',{opacity:0,y:40});gsap.set('#edit-note',{opacity:0});
['#first','#second','#third'].forEach((s,i)=>{tl.to(s,{color:'#0a0a0a',backgroundColor:'#d4f527',duration:.18},.85+i*.45);tl.to(s,{color:'#f4f3ee',backgroundColor:'transparent',duration:.18},1.25+i*.45);});tl.to(['#lead','#bridge','#tail'],{opacity:.15,duration:.6},2.05);tl.to('#source',{opacity:0,scale:.93,duration:.6,ease:'power2.inOut'},2.8);tl.to('#headline-result>div',{opacity:1,y:0,duration:.75,stagger:.13,ease:'power3.out'},3);tl.to('#edit-note',{opacity:1,duration:.4},4.4);
tl.set({},{},6.8);IMM.life(tl);tl.seek(0);
})();</script></body></html>
